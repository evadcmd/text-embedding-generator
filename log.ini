[loggers]
keys = root

[handlers]
keys = console, archive

[formatters]
keys = fmt.default

[logger_root]
level = INFO
handlers = console, archive

[handler_console]
class = StreamHandler
formatter = fmt.default
args = (sys.stdout,)

# .log/ must exist: ConcurrentRotatingFileHandler doesn't create it, and without
# it file logging fails (only a "--- Logging error ---" traceback on stderr).
[handler_archive]
class = concurrent_log_handler.ConcurrentRotatingFileHandler
formatter = fmt.default
level = WARNING
args = ('.log/teg.log', 'a')
kwargs = {'backupCount': 20, 'maxBytes': 1048576, 'use_gzip': True}

# JsonFormatter writes null for fields a record doesn't have (otelTraceID /
# otelSpanID before LoggingInstrumentor runs); a plain Formatter would fail.
[formatter_fmt.default]
class = pythonjsonlogger.json.JsonFormatter
format = %(asctime)s %(levelname)s %(process)d %(name)s %(funcName)s %(lineno)d %(otelTraceID)s %(otelSpanID)s %(message)s
datefmt = %Y-%m-%d %H:%M:%S(%Z)
