[project]
name = "text-embedding-generator"
version = "0.1.0"
description = "A simple word vec generator"
readme = "README.md"
authors = [{ name = "TATA", email = "evadcmd@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "concurrent-log-handler>=0.9.29",
    "fastapi[all]>=0.135.3",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "python-json-logger>=4.2.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.11.0",
    "transformers>=5.5.0",
]

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0", "pytest-cov>=7.1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.build-backend]
module-name = "teg"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
