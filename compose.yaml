services:
  teg-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: teg-api
      args:
        GIT_SHA: ${GIT_SHA:-}
    ports:
      - 5200:5200
    environment:
      OTEL_SERVICE_NAME: teg
      # OTel export is always on. lgtm resolves when joined to lgtm-net
      # (compose.lgtm-shared.yaml); otherwise point this at another LGTM.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://lgtm:4318}
    volumes:
      - teg-log:/app/.log

volumes:
  teg-log:
